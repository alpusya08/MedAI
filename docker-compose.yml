services:

  postgres:
    image: postgres:14-alpine
    container_name: medai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: medai_db
      POSTGRES_USER: medai_user
      POSTGRES_PASSWORD: medai_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - medai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medai_user -d medai_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medai-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: medai_db
      DB_USER: medai_user
      DB_PASSWORD: medai_password
      AI_SERVICE_URL: http://ai-service:8000
      UPLOAD_DIR: /app/uploads
      JWT_SECRET: MedAI-Super-Secret-Key-Change-This-In-Production-2025-Must-Be-Very-Long
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - medai-network

  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    container_name: medai-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - medai-network
    profiles:
      - ai

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  medai-network:
    driver: bridge

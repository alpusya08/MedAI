# Server
spring.application.name=medai-backend
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:medai_db}
spring.datasource.username=${DB_USER:medai_user}
spring.datasource.password=${DB_PASSWORD:medai_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=${JWT_SECRET:MedAI-Super-Secret-Key-Change-This-In-Production-2025-Must-Be-Very-Long-At-Least-256-Bits-For-Security}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Logging
logging.level.com.medai=DEBUG

# AI Service
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.time-zone=UTC

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# File upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
app.upload.dir=${UPLOAD_DIR:./uploads}
